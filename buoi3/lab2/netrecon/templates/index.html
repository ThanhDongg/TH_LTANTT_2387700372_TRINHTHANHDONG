{% extends "layout.html" %}

{% block content %}

<form method="post" action="/scan">

    <label>Target IP:</label>
    <input type="text" name="target" value="127.0.0.1" required>

    <label>Ports:</label>
    <input type="text" name="ports" value="22,80,443,5000" required>

    <label>Mode:</label>
    <select name="mode">
        <option value="all">All</option>
        <option value="scan">Port Scan</option>
        <option value="service">Service Detection</option>
        <option value="banner">Banner Grab</option>
        <option value="map">Network Map</option>
        <option value="vuln">Vulnerability Check</option>
    </select>

    <label>Email nhan ket qua:</label>
    <input type="email" name="email">

    <button type="submit">Scan</button>

</form>

{% endblock %}
